services:
  mysql:
    image: mysql:8.0
    container_name: logiexpress_mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: logiexpress_db
      TZ: America/Mexico_City
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    volumes:
      - ./database/logiexpress.sql:/docker-entrypoint-initdb.d/logiexpress.sql
      - logiexpress_data:/var/lib/mysql

volumes:
  logiexpress_data:
